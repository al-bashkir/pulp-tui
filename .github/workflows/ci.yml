name: ci

on:
  push:
    branches: [main]
    paths: &code
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'Containerfile'
      - '.cargo/**'
      - '.github/workflows/**'
  pull_request:
    paths: *code
  workflow_call: # release.yml runs it before a release (path filters do not apply)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

  live:
    # End-to-end against real Pulp containers (pulpcore + pulp_rpm + pulp_file).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c
      - run: tests/run-live.sh
      - if: failure()
        run: docker logs pulp1 | tail -200; docker logs pulp2 | tail -200 || true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: DOCKER_BUILDKIT=1 docker build -t pulp-tui:ci -f Containerfile .
      - run: docker run --rm --read-only pulp-tui:ci --version

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
