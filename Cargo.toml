[package]
name = "pulp-tui"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
keyring = { version = "4.2.0", optional = true }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream", "http2", "query", "system-proxy", "gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-rustls-aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[features]
default = ["keyring"]
# System credential store (Secret Service / Keychain / Credential Manager).
# Disable for headless container builds: secrets then come from env/files.
keyring = ["dep:keyring"]

[profile.release]
lto = "thin"
strip = true
