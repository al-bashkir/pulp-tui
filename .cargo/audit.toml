# RUSTSEC-2023-0071 (rsa, Marvin timing attack): `rsa` is in Cargo.lock only because sqlx's
# `any` feature names the optional `sqlx-mysql` driver (a weak dependency). pulp-tui does not
# enable `mysql`, so sqlx-mysql and rsa are never compiled: `cargo tree -i rsa --target all`
# is empty with and without default features. Remove this entry when sqlx-mysql is enabled
# (then the advisory applies) or when rsa leaves Cargo.lock.
#
# RUSTSEC-2026-0459 (libsqlite3-sys, bundled SQLite before 3.54.0): a crafted database file
# with a `-wal` file of another page size makes queries return stale process memory. It
# applies only when pulp-tui opens a SQLite file that a less trusted party wrote. pulp-tui
# opens its own `pulp-tui.db` in its data directory, and a `sqlite:` database only when the
# operator names it in the config; keep such files writable only by trusted users. The fix
# needs libsqlite3-sys >= 0.39, but sqlx 0.9.0 (the newest) requires < 0.38. Remove this
# entry when a sqlx release allows libsqlite3-sys >= 0.39 (then update the lock file).
[advisories]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]
