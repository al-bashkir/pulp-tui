# pulp-tui configuration (TOML).
# Location: --config, $PULP_TUI_CONFIG, or $XDG_CONFIG_HOME/pulp-tui/config.toml
# Secrets are NEVER written here: `secret` is a reference resolved at connect time:
#   env:VAR        environment variable (containers, CI)
#   file:/path     file content, e.g. a mounted container secret (/run/secrets/...)
#   keyring        system keyring (Secret Service / macOS Keychain), service "pulp-tui", user = profile name

default_profile = "lab"

[settings]
max_concurrent_requests = 6   # per server
poll_min_ms = 1000            # adaptive task polling bounds
poll_max_ms = 10000
max_response_mb = 64          # larger API responses are rejected
upload_chunk_mb = 8           # chunked upload size
# cv_base_path_prefix: optional. Content View paths are <lc label>/<view>/<repo>.
# A value adds a first segment for servers that have no stored prefix yet.
# "cv" is the old default and is ignored. A server keeps the first prefix it used.
# cv_base_path_prefix = "acme"

# Shared Content View / lifecycle database (optional): the default for profiles without their own
# `database` (see [profiles.prod.database] below). Without either, they stay in the local file.
# `pulp-tui db migrate` creates or upgrades the schema; a normal start never changes it. When it
# cannot be opened, Pulp screens still work and Content View screens show "shared database unavailable: ...".
# [database]
# url = "postgres://pulp_tui@db.example.com:5432/pulp_tui"   # never a password in the URL
# secret = "env:PULP_TUI_DB_PASSWORD"   # env:VAR, file:/path or keyring (user "[database]")
# ca_cert = "/etc/pki/tls/certs/internal-ca.pem"   # PEM file, one or more CA certificates
# PostgreSQL TLS is always verify-full (certificate chain and host name), except for localhost or a Unix socket.
# ca_cert is ADDED to the root certificates built into pulp-tui. The operating system trust store is NOT
# used for the database (unlike ca_cert in a profile), so a private CA always needs ca_cert.
# SQLite instead: safe only when every operator runs pulp-tui on this one host.
# SQLite WAL does not work on network shares (NFS/SMB).
# url = "sqlite:///srv/pulp-tui/cv.db"

[profiles.lab]
url = "http://localhost:8080"
username = "admin"
secret = "env:PULP_PASSWORD"

[profiles.prod]
url = "https://pulp.example.com"
api_root = "/pulp/"
# domain = "rhel"             # only when Pulp domains are enabled
auth = "basic"                # basic | bearer | none
username = "pulp-operator"
secret = "keyring"
ca_cert = "/etc/pki/tls/certs/internal-ca.pem"
# client_cert = "/etc/pulp-tui/client.crt"   # mTLS (together with client_key)
# client_key = "/etc/pulp-tui/client.key"
# proxy = "http://proxy.example.com:3128"
timeout_secs = 30
production = true             # red banner, typed confirmations
read_only = false
# Own Content View database for this profile (same fields as [database]; it wins over [database]).
# [profiles.prod.database]
# url = "postgres://pulp_tui@db.example.com:5432/pulp_tui_prod"
# secret = "keyring"            # keyring user "[database]:prod"
# url = "local" keeps this profile in the local file even when [database] is set.

[profiles.upstream]
url = "https://pulp-upstream.example.com"
auth = "bearer"
secret = "file:/run/secrets/pulp-upstream-token"
read_only = true              # source for fallback replication only
